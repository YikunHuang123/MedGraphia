version: "3.9"

# ============================================================================
# MedGraphia — Full Stack
# Usage:  cp .env.example .env  &&  docker compose up --build
# Services: neo4j · qdrant · redis · api (8058) · worker · ui (8501)
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # Neo4j 5.x — knowledge graph database
  # --------------------------------------------------------------------------
  neo4j:
    image: neo4j:2026.05.0
    container_name: medgraphia_neo4j
    restart: unless-stopped
    # Bound to localhost only — api/worker reach it via the internal Docker
    # network; SSH-tunnel in for Neo4j Browser access, never expose publicly.
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-neo4j}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGE_CACHE:-2G}"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL:-1G}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:-2G}"
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "neo4j status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # --------------------------------------------------------------------------
  # Qdrant — vector store (dense + sparse hybrid)
  # --------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: medgraphia_qdrant
    restart: unless-stopped
    # Bound to localhost only — has no auth by default (QDRANT__SERVICE__API_KEY
    # below is unset), so it must never be reachable from outside this host.
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    # environment:
    #   QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:-}"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --------------------------------------------------------------------------
  # Redis 7 — NER result cache + Arq task-queue broker
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: medgraphia_redis
    restart: unless-stopped
    # Bound to localhost only — no password is configured, so it must never
    # be reachable from outside this host.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # API — FastAPI application (uvicorn, 2 workers)
  # --------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: medgraphia-api:latest
    container_name: medgraphia_api
    restart: unless-stopped
    ports:
      - "8058:8058"
    env_file: .env
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      QDRANT_URL: "http://qdrant:6333"
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      # DSPy compiled programs (data/dspy/) and MeSH data are read at runtime
      - ./data:/app/data:ro
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8058/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # --------------------------------------------------------------------------
  # Worker — Arq pipeline worker (Redis-backed, max 2 concurrent jobs)
  # Trigger a build:  docker compose exec worker python scripts/pipeline/build_graph.py
  # --------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: medgraphia-worker:latest
    container_name: medgraphia_worker
    restart: unless-stopped
    env_file: .env
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      QDRANT_URL: "http://qdrant:6333"
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      # Pipeline writes raw/processed docs and DSPy programs here
      - ./data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Streamlit UI — chat · graph explorer · pipeline monitor · admin
  # --------------------------------------------------------------------------
  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    image: medgraphia-ui:latest
    container_name: medgraphia_ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      API_BASE_URL: "http://api:8058"
    depends_on:
      api:
        condition: service_healthy

volumes:
  # These two are pinned to the pre-existing, fully-ingested volumes by exact
  # name (external: true) so `docker compose up` never silently spins up a
  # fresh empty volume under a different compose-project-name prefix again.
  neo4j_data:
    external: true
    name: neo4j_data
  neo4j_logs:
  qdrant_data:
    external: true
    name: qdrant_data
  redis_data:
