version: "3.9"

# ============================================================================
# MedGraphia — Enterprise Stack
# Usage:  docker compose up --build
# Recommended RAM: 32 GB+
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # Neo4j 5.x — production settings
  # --------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.20-community
    container_name: medgraphia_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-neo4j}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGE_CACHE:-4G}"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL:-1G}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:-4G}"
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "neo4j status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # --------------------------------------------------------------------------
  # Qdrant — vector store
  # --------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: medgraphia_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:-}"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # MinIO — object storage for raw docs and parse artifacts
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-01T01-11-10Z
    container_name: medgraphia_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --------------------------------------------------------------------------
  # API — FastAPI
  # --------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: medgraphia_api
    restart: unless-stopped
    ports:
      - "8058:8058"
    env_file: .env
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      QDRANT_URL: "http://qdrant:6333"
      MINIO_ENDPOINT: "minio:9000"
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8058/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Worker — Prefect pipeline agent
  # --------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: medgraphia_worker
    restart: unless-stopped
    env_file: .env
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      QDRANT_URL: "http://qdrant:6333"
      MINIO_ENDPOINT: "minio:9000"
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Streamlit UI
  # --------------------------------------------------------------------------
  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    container_name: medgraphia_ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      API_BASE_URL: "http://api:8058"
    depends_on:
      api:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  minio_data:
