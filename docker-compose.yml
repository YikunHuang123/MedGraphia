version: "3.9"

# ============================================================================
# MedGraphia — Full Stack
# Usage:  docker compose up --build
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # Neo4j 5.x
  # --------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.20-community
    container_name: medgraphia_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-neo4j}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGE_CACHE:-1G}"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL:-512M}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:-1G}"
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "neo4j status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # --------------------------------------------------------------------------
  # Qdrant — vector store
  # --------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: medgraphia_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:-}"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Redis 7 — NER result cache + Arq task-queue broker
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: medgraphia_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # API — FastAPI application
  # --------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: medgraphia_api
    restart: unless-stopped
    ports:
      - "8058:8058"
    env_file: .env
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      QDRANT_URL: "http://qdrant:6333"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8058/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Worker — Arq pipeline worker (Redis-backed task queue)
  # --------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: medgraphia_worker
    restart: unless-stopped
    env_file: .env
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      QDRANT_URL: "http://qdrant:6333"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Streamlit UI
  # --------------------------------------------------------------------------
  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    container_name: medgraphia_ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      API_BASE_URL: "http://api:8058"
    depends_on:
      api:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  redis_data:
