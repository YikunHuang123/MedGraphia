[project]
name = "medgraphia"
version = "0.1.0"
description = "A GraphRAG-powered multilingual medical knowledge Q&A system"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "neo4j",
    "qdrant-client",
    "langchain",
    "langgraph",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build-meta"
