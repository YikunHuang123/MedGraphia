[project]
name = "medgraphia"
version = "0.1.0"
description = "A GraphRAG-powered multilingual medical knowledge Q&A system"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Yikun Huang", email = "q1945948369@gmail.com" }]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",

    # Config & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # Graph database
    "neo4j>=5.20.0",

    # Vector stores
    "qdrant-client>=1.9.0",
    "chromadb>=0.5.0",

    # LangChain / LangGraph agent orchestration
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langgraph>=0.1.0",

    # Embedding & reranking (BGE-M3, bge-reranker)
    "FlagEmbedding>=1.2.0",
    "sentence-transformers>=3.0.0",

    # Document parsing
    "docling>=2.0.0",

    # OCR fallback
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",

    # PubMed / HTTP data fetching
    "biopython>=1.83",
    "aiohttp>=3.9.0",
    "tenacity>=8.3.0",

    # XML / HTML parsing for EMA SmPC, FDA DailyMed, DrugBank
    "lxml>=5.2.0",
    "beautifulsoup4>=4.12.0",

    # NER models (transformers ecosystem)
    "transformers>=4.41.0",
    "torch>=2.3.0",
    "gliner>=0.2.0",

    # BM25 (entity linking candidate retrieval)
    "rank-bm25>=0.2.2",

    # LLM gateway
    "litellm>=1.40.0",
    "pydantic-ai>=0.0.14",

    # Observability
    "langfuse>=2.30.0",
    "prometheus-client>=0.20.0",

    # Evaluation
    "ragas>=0.1.10",
    "rapidfuzz>=3.0.0",
    "langchain-openai>=0.1.0",
    "langchain-google-vertexai>=2.0.0", # Required by RAGAS 0.4.3 internal imports

    # Pipeline orchestration
    "prefect>=3.0.0",

    # Async task queue + Redis cache
    "arq>=0.25.0",
    "redis>=5.0.0",

    # Utilities
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "orjson>=3.10.0",
    "structlog>=24.2.0",
    "fast-langdetect>=1.0.1",
    "dspy-ai[optuna]>=2.5.0",
    "optuna>=3.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
    "types-lxml>=2024.4.14",
]
generation = [
    # DSPy Predictor support
]
ui = [
    # Streamlit frontend. Installs the UI process dependencies
    # without pulling the heavy ML stack.
    "streamlit>=1.35.0",
    "pyvis>=0.3.2",
    "pandas>=2.2.0",
    "plotly>=5.22.0",
]

[project.scripts]
medgraphia-api = "medgraphia.api:run"

[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["src/medgraphia/tests"]
asyncio_mode = "auto"
