version: "3.9"

# ============================================================================
# MedGraphia — Lite Stack  (16 GB laptop / single machine)
# Usage:  docker compose -f docker-compose.lite.yml up --build
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # Neo4j 5.x — reduced memory footprint
  # --------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.20-community
    container_name: medgraphia_neo4j_lite
    restart: unless-stopped
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-neo4j}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGE_CACHE:-1G}"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL:-512M}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:-1G}"
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data_lite:/data
      - neo4j_logs_lite:/logs
    healthcheck:
      test: ["CMD-SHELL", "neo4j status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # --------------------------------------------------------------------------
  # Qdrant — vector store (lite: single-node, no persistence cluster)
  # --------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: medgraphia_qdrant_lite
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data_lite:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # API — FastAPI application
  # --------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: medgraphia_api_lite
    restart: unless-stopped
    ports:
      - "8058:8058"
    env_file: .env
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      QDRANT_URL: "http://qdrant:6333"
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8058/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Streamlit UI
  # --------------------------------------------------------------------------
  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    container_name: medgraphia_ui_lite
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      API_BASE_URL: "http://api:8058"
    depends_on:
      api:
        condition: service_healthy

volumes:
  neo4j_data_lite:
  neo4j_logs_lite:
  qdrant_data_lite:
